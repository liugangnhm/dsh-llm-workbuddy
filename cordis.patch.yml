- id: llm-pi-ai
  disabled: !!js >-
    (() => {
      const anchor = ctx.get('profileContext')?.installAnchor;
      if (!anchor) return true;
      try {
        const version = JSON.parse(
          process.getBuiltinModule('fs').readFileSync(anchor, 'utf8')).version;
        const parsed = /^(\d+)\.(\d+)(?:\.(\d+))?/.exec(String(version ?? ''));
        if (!parsed) return false;
        return Number(parsed[1]) === 0 && Number(parsed[2]) === 1 && Number(parsed[3] ?? 0) < 7;
      } catch {
        return false;
      }
    })()

- insert:
    - id: llm-workbuddy
      name: '@axiaohungry/dsh-llm-workbuddy'
